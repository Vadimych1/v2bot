[build-system]
requires = [
    "scikit-build-core>=0.10",
    "pybind11>=2.11"
]
build-backend = "scikit_build_core.build"

[project]
name = "rtabmap_py"
version = "0.1.0"
description = "Python bindings for RTAB-Map"
readme = "README.md"
requires-python = ">=3.10"

[tool.scikit-build]
wheel.packages = ["src/rtabmap_py"]