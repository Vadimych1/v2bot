[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "miniros_visual_goal_manager"
version = "1.0.0"
description = "Visual Goal Manager"
authors = [
    {name = "Vadimych1", email = "vadimlebedenko0@gmail.com"}
]
requires-python = ">=3.9"
readme = "README.md"
dependencies = [
   "fastapi>=0.141.0",
   "uvicorn>=0.52.4",
   "pillow>=12.2.0",
   "websockets>=15.0.0"
]

[tool.hatch.build.targets.wheel]
artifacts = ["miniros_visual_goal_manager/*.xml", "miniros_visual_goal_manager/web/*.html"]
packages = ["miniros_visual_goal_manager/"]

[tool.hatch.metadata]
allow-direct-references = true
